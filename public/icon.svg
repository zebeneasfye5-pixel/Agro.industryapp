<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle sunrise arc -->
  <circle cx="256" cy="270" r="140" fill="url(#sunGrad)" opacity="0.35"/>
  <circle cx="256" cy="270" r="100" fill="url(#sunGrad)" opacity="0.45"/>
  
  <!-- Rolling terraced fields -->
  <path d="M 0 380 Q 140 330 280 370 T 512 360 L 512 512 L 0 512 Z" fill="#14532d" opacity="0.95"/>
  <path d="M 0 420 Q 180 390 360 430 T 512 410 L 512 512 L 0 512 Z" fill="#0f391e"/>

  <!-- Golden stalks of Teff / Wheat -->
  <!-- Center stem -->
  <path d="M 256 420 L 256 120" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Grains / leaves arranged up the stalk -->
  <!-- Top grain -->
  <ellipse cx="256" cy="110" rx="12" ry="24" fill="url(#goldGrad)" transform="rotate(0 256 110)"/>
  
  <!-- Pair 1 -->
  <ellipse cx="236" cy="145" rx="13" ry="26" fill="url(#goldGrad)" transform="rotate(-30 236 145)"/>
  <ellipse cx="276" cy="145" rx="13" ry="26" fill="url(#goldGrad)" transform="rotate(30 276 145)"/>

  <!-- Pair 2 -->
  <ellipse cx="230" cy="190" rx="15" ry="30" fill="url(#goldGrad)" transform="rotate(-36 230 190)"/>
  <ellipse cx="282" cy="190" rx="15" ry="30" fill="url(#goldGrad)" transform="rotate(36 282 190)"/>

  <!-- Pair 3 -->
  <ellipse cx="226" cy="240" rx="16" ry="32" fill="url(#goldGrad)" transform="rotate(-40 226 240)"/>
  <ellipse cx="286" cy="240" rx="16" ry="32" fill="url(#goldGrad)" transform="rotate(40 286 240)"/>

  <!-- Pair 4 -->
  <ellipse cx="222" cy="292" rx="17" ry="34" fill="url(#goldGrad)" transform="rotate(-42 222 292)"/>
  <ellipse cx="290" cy="292" rx="17" ry="34" fill="url(#goldGrad)" transform="rotate(42 290 292)"/>

  <!-- Pair 5 -->
  <ellipse cx="220" cy="346" rx="17" ry="34" fill="url(#goldGrad)" transform="rotate(-44 220 346)"/>
  <ellipse cx="292" cy="346" rx="17" ry="34" fill="url(#goldGrad)" transform="rotate(44 292 346)"/>

  <!-- Soil Base -->
  <path d="M 180 435 Q 256 425 332 435 Q 256 450 180 435 Z" fill="#854d0e"/>
</svg>
